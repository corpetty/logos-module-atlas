name: Refresh registry

# Re-resolve the latest Basecamp release and its default catalog, rebuild any
# contract whose pinned commit moved, and commit the result. Then report, as GitHub
# issues that open and close themselves, any hand-written doc the release has left
# behind (atlas:drift) and a refresh that failed (atlas:refresh-failed).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      basecamp_tag:
        description: "Basecamp release tag (blank = latest release)"
        required: false

permissions:
  contents: write # commit the refresh
  issues: write # open and close the atlas:* issues
  actions: write # re-enable the scheduled workflows

env:
  GH_TOKEN: ${{ github.token }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBS: "3"
        run: |
          args=()
          if [ -n "${{ inputs.basecamp_tag }}" ]; then args=(--basecamp-tag "${{ inputs.basecamp_tag }}"); fi
          scripts/refresh.sh "${args[@]}"

      # This job pushes to main, and installed plugins run the mod's code, so the
      # generator must never write it. Anything outside generated data stops the refresh.
      - name: Check the refresh left hand-written files alone
        run: |
          changed=$(git status --porcelain --untracked-files=all -- hooks tests skills scripts .github .claude-plugin)
          if [ -n "$changed" ]; then
            echo "::error::The refresh changed hand-written files:"
            echo "$changed"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A refresh that breaks the mod would ship to every installed copy, so check it first.
      - name: Check the mod against the refreshed data
        run: |
          npm install -g "@anthropic-ai/claude-code@$(cat .github/claude-code-version)"
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
          claude plugin test
          node scripts/check_mod.mjs

      - name: Commit changes
        run: |
          # A refresh that only moved timestamps (generatedAt, an index rebuilt
          # with the same packages) is not worth a commit. README's table and
          # llms.txt derive from registry.json, so comparing it covers them.
          norm() { jq -S 'del(.generatedAt) | .catalogs |= map(del(.indexGeneratedAt))'; }
          before=$(git show HEAD:registry.json | norm | sha256sum)
          after=$(norm < registry.json | sha256sum)
          other=$(git status --porcelain --untracked-files=all -- . ':!registry.json' ':!README.md')
          if [ "$before" = "$after" ] && [ -z "$other" ]; then
            echo "No changes."; exit 0
          fi
          # Installed plugins are cached per version, so bump it or nobody picks the refresh up.
          version="0.1.$(date -u +%Y%m%d%H%M)"
          jq --arg v "$version" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          rel=$(jq -r '.basecamp.tag' registry.json)
          idx=$(jq -r '.catalogs[0].indexGeneratedAt' registry.json)
          git commit -m "refresh: Basecamp ${rel}, catalog index ${idx} (plugin ${version})"
          git push

      # The refresh can't rewrite the stack docs, the guides or gaps.md. Keep one issue
      # open that lists what the release has left behind, and close it once nothing has.
      - name: Report drift in the hand-written docs
        run: |
          if python3 scripts/check_drift.py > "$RUNNER_TEMP/drift.md"; then
            scripts/issue.sh resolve atlas:drift "Nothing has drifted as of $RUN_URL."
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"
            scripts/issue.sh set atlas:drift "Hand-written docs are behind the release" "$RUNNER_TEMP/drift.md"
          fi

      - name: Report the failure
        if: failure()
        run: |
          cat > "$RUNNER_TEMP/failed.md" <<EOF
          The refresh failed: $RUN_URL

          Until it passes, the registry, the cards and installed copies of the plugin miss
          new releases. Open the run to see which step failed. Two of them stop a refresh on
          purpose: one that touched hand-written files, and one whose data the mod can't read.
          EOF
          LABEL_COLOR=d73a4a scripts/issue.sh report atlas:refresh-failed "The daily refresh is failing" "$RUNNER_TEMP/failed.md"

      - name: Close the failure report
        if: success()
        run: |
          scripts/issue.sh resolve atlas:refresh-failed "The refresh passed again: $RUN_URL"

      # GitHub turns off the schedule of a public repository with no activity for 60 days,
      # and a refresh only commits when something changed. Re-enabling the workflows
      # through the API, as keepalive actions do, keeps them running without empty commits.
      - name: Keep the scheduled workflows enabled
        if: always()
        run: |
          for workflow in refresh.yml canary.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable" \
              || echo "::warning::Could not re-enable $workflow"
          done
