name: Refresh registry

# Re-resolve the latest Basecamp release and its default catalog, rebuild any
# contract whose pinned commit moved, and commit the result.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      basecamp_tag:
        description: "Basecamp release tag (blank = latest release)"
        required: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBS: "3"
        run: |
          args=()
          if [ -n "${{ inputs.basecamp_tag }}" ]; then args=(--basecamp-tag "${{ inputs.basecamp_tag }}"); fi
          scripts/refresh.sh "${args[@]}"

      - name: Commit changes
        run: |
          # A refresh that only moved timestamps (generatedAt, an index rebuilt
          # with the same packages) is not worth a commit. README's table and
          # llms.txt derive from registry.json, so comparing it covers them.
          norm() { jq -S 'del(.generatedAt) | .catalogs |= map(del(.indexGeneratedAt))'; }
          before=$(git show HEAD:registry.json | norm | sha256sum)
          after=$(norm < registry.json | sha256sum)
          other=$(git status --porcelain --untracked-files=all -- . ':!registry.json' ':!README.md')
          if [ "$before" = "$after" ] && [ -z "$other" ]; then
            echo "No changes."; exit 0
          fi
          # Installed plugins are cached per version, so bump it or nobody picks the refresh up.
          version="0.1.$(date -u +%Y%m%d%H%M)"
          jq --arg v "$version" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          rel=$(jq -r '.basecamp.tag' registry.json)
          idx=$(jq -r '.catalogs[0].indexGeneratedAt' registry.json)
          git commit -m "refresh: Basecamp ${rel}, catalog index ${idx} (plugin ${version})"
          git push
